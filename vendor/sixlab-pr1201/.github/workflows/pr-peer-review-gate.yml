name: peer-approval

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [peer-approval-signal, test, test-backend]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open main-targeting PR number to reconcile from live GitHub facts
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: peer-approval-${{ inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  # Do not cancel a writer after it may have started a commit-status POST.
  # GitHub keeps one running and the newest pending run for this group, so the
  # pending writer starts afterwards, re-reads live facts, and lands last.
  cancel-in-progress: false

jobs:
  peer-approval:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.pull_requests[0].base.ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: resolve live PR target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if ! [[ "$EVENT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::invalid or missing PR number"
            exit 1
          fi

          response="$RUNNER_TEMP/peer-approval-pr.json"
          status="$(
            curl -sS --connect-timeout 5 --max-time 30 -o "$response" -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$EVENT_PR_NUMBER"
          )"
          if [ "$status" != "200" ]; then
            echo "::error::GitHub pulls API returned HTTP $status while resolving PR #$EVENT_PR_NUMBER"
            jq -r '.message // empty' "$response" >&2 || true
            exit 1
          fi

          jq -e '.state == "open" and .base.ref == "main"' "$response" >/dev/null || {
            echo "::error::PR #$EVENT_PR_NUMBER must be open and target main"
            exit 1
          }
          if ! head_sha="$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' "$response")"; then
            echo "::error::PR #$EVENT_PR_NUMBER returned an invalid live head SHA"
            exit 1
          fi
          printf 'pr_number=%s\nhead_sha=%s\n' "$EVENT_PR_NUMBER" "$head_sha" >> "$GITHUB_OUTPUT"
          echo "resolved live PR #$EVENT_PR_NUMBER head $head_sha"
      - name: load trusted peer gate from workflow snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_GATE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          fetch_gate() {
            local response="$RUNNER_TEMP/verify-peer-approval-response.json"
            local status
            status="$(
              curl -sS --connect-timeout 5 --max-time 30 -o "$response" -w '%{http_code}' \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/scripts/ci/verify-peer-approval.mjs?ref=$TRUSTED_GATE_SHA"
            )"
            case "$status" in
              200)
                jq -er '.content' "$response" | base64 -d > "$RUNNER_TEMP/verify-peer-approval.mjs"
                ;;
              *)
                echo "::error::GitHub contents API returned HTTP $status while loading peer gate"
                jq -r '.message // empty' "$response" >&2 || true
                return 1
                ;;
            esac
          }

          fetch_gate
          echo "loaded trusted peer gate from workflow snapshot $TRUSTED_GATE_SHA"
          test -s "$RUNNER_TEMP/verify-peer-approval.mjs"
      - name: reconcile current-head peer approval status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          ALLOWED_REVIEWERS: ${{ vars.PR_REQUIRED_REVIEWERS || 'Steven-ZYH,miaopantao' }}
          REVIEW_DUTY_REVIEWER: StevenZYHHome
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node "$RUNNER_TEMP/verify-peer-approval.mjs" \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$HEAD_SHA" \
            --pr-number "$PR_NUMBER" \
            --allowed-reviewers "$ALLOWED_REVIEWERS,$REVIEW_DUTY_REVIEWER" \
            --publish-status-context "peer-approval/current-head" \
            --status-target-url "$STATUS_TARGET_URL"
